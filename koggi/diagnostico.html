document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"cc8f35b7-1dbd-42b4-acec-6a34e4485fc4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"89b99528-e449-476c-8a9d-1dd8016237b0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"a9c972bf-b63e-4426-be7b-b88ac141487c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e2529315-2ae7-41e2-bbc9-0b5236fb3e93\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"27a77010-c3db-4d19-a446-4ea8aec14fe6\"><\u002Fscript>\n\n<script type=\"application/json\" id=\"speaker-notes\">\n[\n\"Buenas. Lo que tienen enfrente es el readout del diagnóstico que hicimos durante las últimas dos semanas sobre la organización de producto y tecnología de Koggi. Once entrevistas, setenta y seis repositorios, y una conclusión central que vamos a desarmar hoy. Mi intención no es darles sorpresas: ustedes ya viven esto todos los días. Lo que vengo a hacer es nombrar los patrones, ordenarlos, y proponer en qué orden atacarlos.\",\n\n\"Empecemos por la pregunta que ustedes nos trajeron. Era una pregunta concreta: cómo se mueve más rápido el equipo, cómo se construye mejor producto, y cómo se decide con evidencia. Para responderla, organizamos el análisis en cuatro lentes: estrategia, ¿estamos resolviendo los problemas correctos?; discovery, ¿sabemos si lo que construimos va a funcionar?; delivery, ¿entregamos de manera confiable?; y modelo operativo, ¿el sistema está diseñado para ganar? Con esa lente hicimos once entrevistas individuales con todo el liderazgo y parte del equipo, y un análisis arquitectónico de los setenta y seis repositorios. Esas cuatro preguntas son la estructura con la que van a ver el resto de la presentación.\",\n\n\"Y aquí está el hallazgo que tiene que aterrizar antes que cualquier otro. Koggi opera como una fábrica de software. Y eso no es un juicio sobre las personas, es una descripción del sistema. El equipo recibe funcionalidades a construir, no problemas a resolver. Se mide por output: historias en sprint, productos lanzados. No tiene contacto sistemático con clientes. Cero de los once entrevistados pueden nombrar una métrica de outcome del equipo de producto. Cero. Eso explica el resto.\",\n\n\"Y lo importante es entender por qué esto se mantiene en el tiempo. Es un ciclo que se auto-refuerza. No hay métricas de outcome, entonces el liderazgo no puede evaluar la competencia del equipo. Si no puede evaluarla, retiene la decisión de qué construir y entrega features. El equipo construye lo pedido, se mide por output. Sin medir outcome, no hay evidencia de valor. Sin evidencia, la confianza no crece. Y el siguiente sprint vuelve a llegar con features ya definidas. Cada lado actúa racionalmente. Por eso no basta con pedirle al equipo que cambie de actitud: hay que romper el ciclo desde afuera.\",\n\n\"Del análisis salieron nueve insights estructurales. No los voy a leer uno por uno aquí, los vamos a recorrer en los siguientes tres slides agrupados por los cuatro pilares. Lo que quiero que se queden con esta vista es que los nueve insights no son cosas sueltas: cada uno cae en uno de los pilares y todos vuelven al insight central de fábrica de software. Estrategia y discovery son donde está la herida más profunda. Delivery es donde está el techo de velocidad. Modelo operativo es donde están los reflejos que hay que cambiar.\",\n\n\"Estrategia y discovery. Tres insights. El equipo opera como fábrica de software, ya lo dijimos. Producto no conoce al cliente: cero menciones de contacto regular en once entrevistas, los BAs tuvieron una y cero reuniones con clientes en sus primeros meses, una sola iniciativa abandonada por evidencia de cliente en la historia reciente. Y la adquisición en parálisis: treinta y cinco a treinta y seis clientes en dos años, cumplimiento de ventas nuevas en treinta por ciento. Y aquí hay un punto importante: sin discovery no podemos saber si la parálisis es problema comercial o problema de producto. Esa pregunta hay que resolverla antes de invertir en crecer.\",\n\n\"Delivery y aprendizaje. Cuatro insights. El equipo entrega pero no aprende: ceremonias ágiles sin la mentalidad ágil, sin hipótesis declaradas, sin feature flags, sin A/B tests, sin instrumentación de uso. Sin métricas de delivery los cuellos son invisibles: la CTO ve al equipo saturado, los devs reportan adelantar dos sprints; ambas cosas son ciertas porque ningún dato las confronta. La calidad funcional escapa al QA, los defectos los encuentra la CSM cuando arma informes con clientes. Y el techo duro: cero tests automatizados, cero CI en setenta y seis repos, deploys manuales cada dos semanas con todo el equipo conectado en la noche. Por bueno que sea el discovery, ese cuello convierte cada decisión en supervisión nocturna.\",\n\n\"Modelo operativo. Dos insights, pero son los que predicen el comportamiento futuro. El primero: Koggi construye agentes de IA para clientes pero ninguno para sí misma. El gemelo de QA que la CTO conceptualizó no existe porque el QA está hasta el cuello probando, no tiene tiempo de construirlo. Tienen la capacidad técnica, pero no apuntada hacia adentro. Y el segundo es el reflejo: cuando algo es difícil, la respuesta default es contratar. La CPO pide un PM. El CFO pide un KAM para México. La KAM dice que es difícil con tres personas. Nadie propone primero automatizar o apalancar. Para una empresa con runway limitado ese reflejo es caro.\",\n\n\"Los nueve insights se traducen en nueve pain points críticos. Esta es la lista priorizada. Quiero que vean dos cosas. Primero, los tres primeros son del mismo árbol: medirse por output, recibir features en vez de problemas, no tener discovery. Esos tres son el modelo operativo de fábrica de software. Segundo, el ocho — cero tests, cero CI/CD en setenta y seis repos — es el techo duro de velocidad. Y el nueve — adquisición de clientes lenta — es la consecuencia visible que el negocio siente en la línea de ingresos.\",\n\n\"Seis pain points medios. No son menos reales, pero son derivados. La CPO entrenando juniors en vez de hablar con clientes. El cincuenta por ciento de capacidad ociosa en devs reciclada en deuda técnica. La calidad de negocio que se valida en producción. La capacidad de IA cien por ciento orientada al cliente y cero por ciento adentro. Sin postmortems. Y el reflejo de contratar como respuesta default. Estos seis se mueven cuando los nueve críticos se atacan.\",\n\n\"Para no atacar los síntomas sin cambiar el modelo, nos apoyamos en el marco de Marty Cagan y el Silicon Valley Product Group. La idea central es pasar de fábrica de software a Product Operating Model: el equipo recibe problemas, no features; hace discovery para encontrar la mejor solución; y rinde por outcomes, no por features entregadas. Para que ese modelo se instale hay tres condiciones previas, en orden. Liderazgo de producto competente. Equipo con las capacidades. Y una relación redefinida con el negocio. Koggi hoy no cumple ninguna de las tres. El roadmap ataca las tres en paralelo.\",\n\n\"El roadmap es de noventa días y se organiza en tres pilares. People: incorporar un consultor de producto senior embebido que haga el trabajo, no que enseñe; la CPO aprende por proximidad. Process: comité único de priorización que convierte feature requests en problemas, métricas vivas en un dashboard, CI/CD en repos críticos, y migración de sprints a flujo continuo. Product: discovery sistemático con diez clientes en las primeras siete semanas, y un ciclo de experimentación donde cada semana hay al menos un experimento activo. People arranca primero. Sin la capacidad correcta, los otros dos pilares no se sostienen.\",\n\n\"Para cerrar, qué se logra al cierre de los noventa días. La organización tiene datos para decidir, no percepción. El equipo ha hablado con diez clientes o más por primera vez de forma sistemática. El ciclo de desconfianza tiene su primera señal medible. Se corrieron al menos dos experimentos con decisión basada en evidencia. Y sabemos por qué los clientes no compran y por qué se van. Eso no es la transformación completa, es el cimiento. Pero es el cimiento que hoy no existe. Gracias. Quedo atento a las preguntas.\"\n]\n<\u002Fscript>\n<style>\n:root {\n  --bg: #F6F2EC;\n  --bg-2: #EDE8DE;\n  --fg: #161A22;\n  --fg-2: #3C4049;\n  --muted: #6B6E76;\n  --muted-2: #A8ABB1;\n  --line: rgba(22, 26, 34, 0.12);\n  --line-strong: rgba(22, 26, 34, 0.24);\n  --accent: #C25A36;\n  --accent-soft: rgba(194, 90, 54, 0.10);\n  --red: #B23A22;\n\n  --type-display: 132px;\n  --type-title: 64px;\n  --type-h2: 44px;\n  --type- n  grid-template-columns: 36px 1fr;\n  gap: 16px;\n  align-items: baseline;\n}\n.pillar-card li .li-n {\n  font-family: var(--mono);\n  font-size: 24px;\n  color: var(--accent);\n  letter-spacing: 0.10em;\n}\n.pillar-card li .li-t {\n  font-size: 24px;\n  line-height: 1.32;\n  color: var(--fg);\n  font-weight: 500;\n}\n.pillar-card li .li-s {\n  display: block;\n  font-size: 24px;\n  color: var(--muted);\n  margin-top: 4px;\n  font-weight: 400;\n  line-height: 1.32;\n}\n\n/* ─── Slide 13 · Cierre ─── */\n.cierre {\n  flex: 1;\n  display: grid;\n  grid-template-columns: 1fr 1.2fr;\n  gap: 96px;\n  align-items: start;\n}\n.cierre .lead {\n  font-size: 44px;\n  line-height: 1.12;\n  letter-spacing: -0.018em;\n  font-weight: 500;\n  text-wrap: balance;\n}\n.cierre .lead em {\n  font-family: var(--serif);\n  font-style: italic;\n  font-weight: 400;\n  color: var(--accent);\n}\n.cierre .lead .sub {\n  display: block;\n  font-size: 24px;\n  font-weight: 400;\n  color: var(--muted);\n  margin-top: 28px;\n  line-height: 1.45;\n}\n.cierre ul { margin: 0; padding: 0; list-style: none; }\n.cierre li {\n  display: grid;\n  grid-template-columns: 64px 1fr;\n  align-items: baseline;\n  gap: 20px;\n  padding: 22px 0;\n  border-top: 1px solid var(--line);\n  font-size: 24px;\n  color: var(--fg);\n  line-height: 1.35;\n}\n.cierre li:last-child { border-bottom: 1px solid var(--line); }\n.cierre li .ck {\n  font-family: var(--serif);\n  font-size: 30px;\n  color: var(--accent);\n  line-height: 1;\n}\n\n/* tiny utility */\n.right { text-align: right; }\n.accent { color: var(--accent); }\n.serif-em { font-family: var(--serif); font-style: italic; font-weight: 400; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<deck-stage width=\"1920\" height=\"1080\">\n\n<!-- ════════════════════════════════════════════════════════════════\n     SLIDE 1 · COVER\n═════════════════════════════════════════════════════════════════ -->\n<section data-label=\"01 Portada\">\n  <div class=\"cover\">\n    <div class=\"brand\">\n      <span class=\"square\"><\u002Fspan>\n      <span>TNHI<\u002Fspan>\n      <span class=\"x\">×<\u002Fspan>\n      <span>Koggi<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"meta\">\n      <div>Diagnóstico · Q4 2025<\u002Fdiv>\n      <div>Confidencial · TNHI<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"main\">\n      <div class=\"kicker\">Readout ejecutivo · sprint de 2 semanas<\u002Fdiv>\n      <h1 class=\"title\">Diagnóstico de<br>Producto y <em>Tecnología.<\u002Fem><\u002Fh1>\n      <p class=\"cover-sub\">Cómo Koggi se mueve más rápido, construye mejor producto, y decide con evidencia.<\u002Fp>\n      <div class=\"stats\">\n        <div class=\"stat\"><div class=\"n\">11<\u002Fdiv><div class=\"l\">entrevistas individuales<\u002Fdiv><\u002Fdiv>\n        <div class=\"stat\"><div class=\"n\">76<\u002Fdiv><div class=\"l\">repositorios analizados<\u002Fdiv><\u002Fdiv>\n        <div class=\"stat\"><div class=\"n\">9<\u002Fdiv><div class=\"l\">insights estructurales<\u002Fdiv><\u002Fdiv>\n        <div class=\"stat\"><div class=\"n\">19<\u002Fdiv><div class=\"l\">pain points priorizados<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════════════════\n     SLIDE 2 · CONTEXTO + METODOLOGÍA\n═════════════════════════════════════════════════════════════════ -->\n<section data-label=\"02 Contexto y método\">\n  <div class=\"chrome\">\n    <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>02 · Contexto y método<\u002Fdiv>\n    <div class=\"rule-top\"><\u002Fdiv>\n    <div class=\"footer\"><span>TNHI × Koggi · Diagnóstico<\u002Fspan><span class=\"right\">02 / 13<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"body\">\n    <h1 class=\"h1\">La pregunta, lo que es Koggi hoy, y cómo construimos el diagnóstico.<\u002Fh1>\n    <div class=\"cols-3\">\n      <div class=\"col-card\">\n        <div class=\"label\">La pregunta<\u002Fdiv>\n        <p class=\"ctitle\"><em>¿Cómo<\u002Fem> se mueve más rápido el equipo, construye mejor producto, y decide con evidencia?<\u002Fp>\n        <p class=\"p small\">Koggi llegó con una pregunta operativa concreta. El diagnóstico la convierte en una pregunta estructural: qué factores del sistema explican la brecha entre capacidad técnica y velocidad de creación de valor.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"col-card\">\n        <div class=\"label\">La lente<\u002Fdiv>\n        <p class=\"ctitle\">Cuatro preguntas para revisar la cultura de producto.<\u002Fp>\n        <ul class=\"lens-list\">\n          <li><span class=\"lens-name\">Estrategia.<\u002Fspan> ¿Estamos resolviendo los problemas correctos?<\u002Fli>\n          <li><span class=\"lens-name\">Discovery.<\u002Fspan> ¿Sabemos si lo que construimos va a funcionar?<\u002Fli>\n          <li><span class=\"lens-name\">Delivery.<\u002Fspan> ¿Entregamos de manera confiable?<\u002Fli>\n          <li><span class=\"lens-name\">Modelo operativo.<\u002Fspan> ¿El sistema está diseñado para ganar?<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"col-card\">\n        <div class=\"label\">El método<\u002Fdiv>\n        <p class=\"ctitle\">11 entrevistas semiestructuradas + análisis de 76 repos.<\u002Fp>\n        <p class=\"p small\">CEO, CTO, CPO, CFO, KAM, BI, CSM, 2 BAs y 2 devs. Cada conversación orientada a cómo se decide qué construir, cómo se construye, cómo se mide el éxito, y dónde percibe cada rol los cuellos de botella. En código: estructura, dependencias, tests, CI/CD y patrones de deploy.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════════════════\n     SLIDE 3 · HALLAZGO CENTRAL\n═════════════════════════════════════════════════════════════════ -->\n<section data-label=\"03 Hallazgo central\">\n  <div class=\"chrome\">\n    <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>03 · Hallazgo central<\u002Fdiv>\n    <div class=\"rule-top\"><\u002Fdiv>\n    <div class=\"footer\"><span>TNHI × Koggi · Diagnóstico<\u002Fspan><span class=\"right\">03 / 13<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"body\">\n    <div class=\"hallazgo\">\n      <div>\n        <span class=\"tag\">Hallazgo central<\u002Fspan>\n        <p class=\"quote\" style=\"margin-top: 36px;\">Koggi opera como una <em>fábrica de software:<\u002Fem> recibe funcionalidades a construir, no problemas a resolver.<\u002Fp>\n        <p class=\"sub\">Se mide por output (historias en sprint, productos lanzados) en lugar de outcomes. No tiene contacto sistemático con clientes. El resultado es un ciclo de desconfianza entre liderazgo y equipo que se auto-refuerza cada sprint.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"evid\">\n        <div class=\"row\">\n          <div class=\"n\">0<\u002Fdiv>\n          <div class=\"t\"><b style=\"color:var(--fg);font-weight:500\">métricas de outcome<\u002Fb><br><span class=\"mono\" style=\"font-size:24px\">de 11 entrevistados<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"row\">\n          <div class=\"n\">0<\u002Fdiv>\n          <div class=\"t\"><b style=\"color:var(--fg);font-weight:500\">contacto sistemático con clientes<\u002Fb><br><span class=\"mono\" style=\"font-size:24px\">desde producto<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"row\" style=\"border-bottom: none\">\n          <div class=\"n\">0<\u002Fdiv>\n          <div class=\"t\"><b style=\"color:var(--fg);font-weight:500\">tests automatizados ni CI/CD<\u002Fb><br><span class=\"mono\" style=\"font-size:24px\">en 76 repositorios<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════════════════\n     SLIDE 4 · CICLO VICIOSO\n═════════════════════════════════════════════════════════════════ -->\n<section data-label=\"04 Ciclo vicioso\">\n  <div class=\"chrome\">\n    <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>04 · Por qué se mantiene<\u002Fdiv>\n    <div class=\"rule-top\"><\u002Fdiv>\n    <div class=\"footer\"><span>TNHI × Koggi · Diagnóstico<\u002Fspan><span class=\"right\">04 / 13<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"body\">\n    <h1 class=\"h1\">El sistema se auto-refuerza: cada lado actúa racionalmente.<\u002Fh1>\n    <div class=\"cycle\">\n      <div class=\"left\">\n        <p class=\"p\">Sin métricas de outcome, el liderazgo no puede evaluar la competencia del equipo y retiene la decisión de qué construir. El equipo construye lo pedido y se mide por output. Sin medición de outcome no hay evidencia de valor, la confianza no crece, y el siguiente sprint llega de nuevo con features ya definidas.<\u002Fp>\n        <p class=\"p small\" style=\"margin-top: 28px; color: var(--muted);\">Por eso no basta con pedirle al equipo que cambie de actitud. Hay que romper el ciclo desde afuera: instalar métricas, entregar problemas, y medir outcomes.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <svg viewBox=\"0 0 760 640\" class=\"cycle-svg\">\n          <defs>\n            <marker id=\"arrow\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\">\n              <path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#D97757\"><\u002Fpath>\n            <\u002Fmarker>\n          <\u002Fdefs>\n          <!-- 4 nodes arranged in a diamond -->\n          <!-- N1: top -->\n          <rect class=\"cycle-node accent\" x=\"210\" y=\"20\" width=\"340\" height=\"110\" rx=\"4\"><\u002Frect>\n          <text class=\"cycle-num\" x=\"228\" y=\"48\">01<\u002Ftext>\n          <text class=\"cycle-text\" x=\"228\" y=\"82\">Sin métricas de outcome,<\u002Ftext>\n          <text class=\"cycle-text\" x=\"228\" y=\"112\">no se evalúa al equipo<\u002Ftext>\n\n          <!-- N2: right -->\n          <rect class=\"cycle-node\" x=\"418\" y=\"240\" width=\"340\" height=\"110\" rx=\"4\"><\u002Frect>\n          <text class=\"cycle-num\" x=\"436\" y=\"268\">02<\u002Ftext>\n          <text class=\"cycle-text\" x=\"436\" y=\"302\">Liderazgo entrega features,<\u002Ftext>\n          <text class=\"cycle-text\" x=\"436\" y=\"332\">no problemas<\u002Ftext>\n\n          <!-- N3: bottom -->\n          <rect class=\"cycle-node\" x=\"210\" y=\"460\" width=\"340\" height=\"110\" rx=\"4\"><\u002Frect>\n          <text class=\"cycle-num\" x=\"228\" y=\"488\">03<\u002Ftext>\n          <text class=\"cycle-text\" x=\"228\" y=\"522\">El equipo construye lo pedido,<\u002Ftext>\n          <text class=\"cycle-text\" x=\"228\" y=\"552\">se mide por output<\u002Ftext>\n\n          <!-- N4: left -->\n          <rect class=\"cycle-node\" x=\"2\" y=\"240\" width=\"340\" height=\"110\" rx=\"4\"><\u002Frect>\n          <text class=\"cycle-num\" x=\"20\" y=\"268\">04<\u002Ftext>\n          <text class=\"cycle-text\" x=\"20\" y=\"302\">Sin evidencia de valor,<\u002Ftext>\n          <text class=\"cycle-text\" x=\"20\" y=\"332\">la confianza no crece<\u002Ftext>\n\n          <!-- arrows -->\n          <path class=\"cycle-arrow\" d=\"M550 80 Q 680 80 680 240\"><\u002Fpath>\n          <path class=\"cycle-arrow\" d=\"M598 350 Q 598 470 550 480\"><\u002Fpath>\n          <path class=\"cycle-arrow\" d=\"M210 510 Q 110 510 110 350\"><\u002Fpath>\n          <path class=\"cycle-arrow\" d=\"M162 240 Q 162 70 210 70\"><\u002Fpath>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════════════════\n     SLIDE 5 · INSIGHT MAP\n═════════════════════════════════════════════════════════════════ -->\n<section data-label=\"05 9 insights · 4 pilares\">\n  <div class=\"chrome\">\n    <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>05 · Mapa de hallazgos<\u002Fdiv>\n    <div class=\"rule-top\"><\u002Fdiv>\n    <div class=\"footer\"><span>TNHI × Koggi · Diagnóstico<\u002Fspan><span class=\"right\">05 / 13<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"body\">\n    <h1 class=\"h1\" style=\"font-size: 44px; margin-bottom: 32px;\">Nueve insights, cuatro pilares. <span style=\"color:var(--muted)\">Todos vuelven al hallazgo central.<\u002Fspan><\u002Fh1>\n    <div class=\"imap\">\n      <div class=\"pillar\">\n        <div class=\"pname\">Estrategia<\u002Fdiv>\n        <div class=\"icard\">\n          <div class=\"iid\">Insight 01<\u002Fdiv>\n          <div class=\"itxt\">Koggi opera como fábrica de software<\u002Fdiv>\n          <div class=\"isum\">Recibe features, no problemas; se mide por output.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pillar\">\n        <div class=\"pname\">Discovery<\u002Fdiv>\n        <div class=\"icard\">\n          <div class=\"iid\">Insight 02<\u002Fdiv>\n          <div class=\"itxt\">Producto no conoce al cliente<\u002Fdiv>\n          <div class=\"isum\">El roadmap se alimenta de comercial y de la intuición del CEO.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"icard\">\n          <div class=\"iid\">Insight 03<\u002Fdiv>\n          <div class=\"itxt\">El equipo entrega sin aprender<\u002Fdiv>\n          <div class=\"isum\">Ceremonias ágiles sin instrumentación ni hipótesis.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"icard\">\n          <div class=\"iid\">Insight 06<\u002Fdiv>\n          <div class=\"itxt\">Adquisición en parálisis estructural<\u002Fdiv>\n          <div class=\"isum\">No se distingue si es problema comercial o de producto.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pillar\">\n        <div class=\"pname\">Delivery<\u002Fdiv>\n        <div class=\"icard\">\n          <div class=\"iid\">Insight 04<\u002Fdiv>\n          <div class=\"itxt\">Sin métricas, los cuellos son invisibles<\u002Fdiv>\n          <div class=\"isum\">Saturación percibida y capacidad ociosa conviven.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"icard\">\n          <div class=\"iid\">Insight 05<\u002Fdiv>\n          <div class=\"itxt\">La calidad funcional escapa al QA<\u002Fdiv>\n          <div class=\"isum\">Reglas de negocio sin documentar; los detecta comercial.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"icard\">\n          <div class=\"iid\">Insight 07<\u002Fdiv>\n          <div class=\"itxt\">Sin tests ni CI/CD, hay techo de velocidad<\u002Fdiv>\n          <div class=\"isum\">Cada deploy es supervisión manual nocturna del equipo.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pillar\">\n        <div class=\"pname\">Modelo operativo<\u002Fdiv>\n        <div class=\"icard\">\n          <div class=\"iid\">Insight 08<\u002Fdiv>\n          <div class=\"itxt\">IA para clientes, no para sí misma<\u002Fdiv>\n          <div class=\"isum\">Cinco agentes apuntados afuera, cero destrabando adentro.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"icard\">\n          <div class=\"iid\">Insight 09<\u002Fdiv>\n          <div class=\"itxt\">El reflejo es contratar, no apalancar<\u002Fdiv>\n          <div class=\"isum\">Ante cualquier restricción, la respuesta default es contratar.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════════════════\n     SLIDE 6 · ESTRATEGIA & DISCOVERY\n═════════════════════════════════════════════════════════════════ -->\n<section data-label=\"06 Estrategia y Discovery\">\n  <div class=\"chrome\">\n    <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>06 · Estrategia y Discovery<\u002Fdiv>\n    <div class=\"rule-top\"><\u002Fdiv>\n    <div class=\"footer\"><span>TNHI × Koggi · Diagnóstico<\u002Fspan><span class=\"right\">06 / 13<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"body\">\n    <h1 class=\"h1\">El equipo construye sin conocer al cliente, y la adquisición no se mueve.<\u002Fh1>\n    <div class=\"insights n3\">\n      <div class=\"icard-lg\">\n        <div class=\"iid\">Insight 01 · Estrategia<\u002Fdiv>\n        <h3 class=\"ititle\">Koggi opera como fábrica de software<\u002Fh3>\n        <p class=\"idesc\">Sin métricas de outcome, el liderazgo no puede evaluar al equipo y entrega features específicas. Cada lado actúa racionalmente dentro del sistema.<\u002Fp>\n        <div class=\"ievid\">0 de 11 entrevistados pueden nombrar una métrica de outcome del equipo de producto.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard-lg\">\n        <div class=\"iid\">Insight 02 · Discovery<\u002Fdiv>\n        <h3 class=\"ititle\">Producto no conoce al cliente<\u002Fh3>\n        <p class=\"idesc\">El roadmap se alimenta de comercial y la intuición del CEO. Producto se concibió como función operativa (refinar historias) y no estratégica (entender problemas).<\u002Fp>\n        <div class=\"ievid\">Los dos BAs tuvieron 1 y 0 reuniones con clientes en sus primeros meses. 1 sola iniciativa abandonada por evidencia de cliente.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard-lg\">\n        <div class=\"iid\">Insight 06 · Discovery<\u002Fdiv>\n        <h3 class=\"ititle\">Adquisición en parálisis estructural<\u002Fh3>\n        <p class=\"idesc\">Sin discovery sistemático, no se puede distinguir si el problema es comercial (ICP, motor de demanda) o de producto (no resuelve lo suficiente para justificar precio).<\u002Fp>\n        <div class=\"ievid\">35 → 36 clientes en 2 años. Cumplimiento Q1 de ventas nuevas: 30 %. Churn por replicación in-house.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════════════════\n     SLIDE 7 · DELIVERY & APRENDIZAJE\n═════════════════════════════════════════════════════════════════ -->\n<section data-label=\"07 Delivery y Aprendizaje\">\n  <div class=\"chrome\">\n    <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>07 · Delivery y Aprendizaje<\u002Fdiv>\n    <div class=\"rule-top\"><\u002Fdiv>\n    <div class=\"footer\"><span>TNHI × Koggi · Diagnóstico<\u002Fspan><span class=\"right\">07 / 13<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"body\">\n    <h1 class=\"h1\">La velocidad tiene un techo de infraestructura, y la calidad se valida en producción.<\u002Fh1>\n    <div class=\"insights n4\">\n      <div class=\"icard-lg\">\n        <div class=\"iid\">Insight 03 · Discovery<\u002Fdiv>\n        <h3 class=\"ititle\">El equipo entrega sin aprender<\u002Fh3>\n        <p class=\"idesc\">Ceremonias ágiles sin mentalidad ágil. Ni hipótesis pre-lanzamiento ni instrumentación post.<\u002Fp>\n        <div class=\"ievid\">0 menciones de feature flags, A/B tests o métricas de activación en 11 entrevistas.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard-lg\">\n        <div class=\"iid\">Insight 04 · Delivery<\u002Fdiv>\n        <h3 class=\"ititle\">Cuellos invisibles, cadencia rígida<\u002Fh3>\n        <p class=\"idesc\">Sin medir throughput, WIP ni cycle time. Saturación percibida y capacidad ociosa coexisten sin chocar.<\u002Fp>\n        <div class=\"ievid\">CTO: equipo saturado. Devs: adelantan 2-3 historias del siguiente sprint. Ningún dato confronta.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard-lg\">\n        <div class=\"iid\">Insight 05 · Delivery<\u002Fdiv>\n        <h3 class=\"ititle\">La calidad funcional escapa al QA<\u002Fh3>\n        <p class=\"idesc\">Reglas de negocio en la cabeza de un dev senior. QA funcional no técnico; los defectos los encuentra comercial.<\u002Fp>\n        <div class=\"ievid\">Profile Pro v2: la CSM detectó clientes sin capacidad de pago marcados como elegibles, no producto en discovery.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard-lg\">\n        <div class=\"iid\">Insight 07 · Delivery<\u002Fdiv>\n        <h3 class=\"ititle\">Sin tests ni CI/CD, hay techo duro<\u002Fh3>\n        <p class=\"idesc\">Cada deploy es un evento del calendario: todo el equipo conectado en la noche, merge manual, monitoreo en vivo.<\u002Fp>\n        <div class=\"ievid\">0 tests automatizados y 0 pipeline de CI en 76 repos. Deploys cada 2 semanas después de las 6 pm.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════════════════\n     SLIDE 8 · MODELO OPERATIVO\n═════════════════════════════════════════════════════════════════ -->\n<section data-label=\"08 Modelo operativo\">\n  <div class=\"chrome\">\n    <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>08 · Modelo operativo<\u002Fdiv>\n    <div class=\"rule-top\"><\u002Fdiv>\n    <div class=\"footer\"><span>TNHI × Koggi · Diagnóstico<\u002Fspan><span class=\"right\">08 / 13<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"body\">\n    <h1 class=\"h1\">Tiene capacidad de IA y la apunta hacia afuera; ante cualquier restricción, el reflejo es contratar.<\u002Fh1>\n    <div class=\"insights n2\">\n      <div class=\"icard-lg\">\n        <div class=\"iid\">Insight 08 · Modelo operativo<\u002Fdiv>\n        <h3 class=\"ititle\">Koggi construye IA para clientes, pero no para sí misma<\u002Fh3>\n        <p class=\"idesc\">Hay capacidad real probada en Vertex AI, Agent Development Kit y MCP servers. Cinco agentes orientados al cliente, cero internos. La brecha entre la retórica «AI-first» y la realidad operativa es de presupuesto y de un dev senior dedicado.<\u002Fp>\n        <div class=\"ievid\">CTO: «no hay inversión ni de tiempo ni de plata para investigación». El gemelo de QA conceptualizado no existe porque el QA no tiene tiempo de construirlo.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"icard-lg\">\n        <div class=\"iid\">Insight 09 · Modelo operativo<\u002Fdiv>\n        <h3 class=\"ititle\">El reflejo organizacional es contratar, no apalancar<\u002Fh3>\n        <p class=\"idesc\">Cuando algo es difícil, la respuesta es más personas. Nadie propone como primera opción automatizar, eliminar una tarea, o usar IA para multiplicar lo que ya existe. La pregunta «¿cómo rinde 3× la misma persona?» no es parte del vocabulario operativo.<\u002Fp>\n        <div class=\"ievid\">CPO pide PM. CFO pide KAM México. KAM: «difícil con tres personas». Para una empresa con runway limitado, ese reflejo es caro.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════════════════\n     SLIDE 9 · PAIN POINTS CRÍTICOS\n═════════════════════════════════════════════════════════════════ -->\n<section data-label=\"09 Pain points críticos\">\n  <div class=\"chrome\">\n    <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>09 · Pain points · críticos<\u002Fdiv>\n    <div class=\"rule-top\"><\u002Fdiv>\n    <div class=\"footer\"><span>TNHI × Koggi · Diagnóstico<\u002Fspan><span class=\"right\">09 / 13<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"body\">\n    <h1 class=\"h1\" style=\"margin-bottom: 28px;\">Nueve pain points críticos, priorizados.<\u002Fh1>\n    <div class=\"painsec\">\n      <table class=\"ptbl\">\n        <thead>\n          <tr>\n            <th style=\"width:64px\">#<\u002Fth>\n            <th style=\"width:520px\">Pain point<\u002Fth>\n            <th>Por qué es un dolor<\u002Fth>\n          <\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr><td class=\"num\">01<\u002Ftd><td class=\"pp\">Medido por output, no por outcomes<\u002Ftd><td>Sin métricas objetivas, ninguna intervención del plan es medible para éxito.<\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">02<\u002Ftd><td class=\"pp\">Equipo recibe funcionalidades, no problemas<\u002Ftd><td>El roadmap queda dictado por quien grita más fuerte, no por lo que mueve la aguja.<\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">03<\u002Ftd><td class=\"pp\">No hay metodología continua de discovery<\u002Ftd><td>Producto no sabe qué resuelve y qué no; las decisiones no son verificables.<\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">04<\u002Ftd><td class=\"pp\">Sin sistema de aprendizaje validado<\u002Ftd><td>Cada lanzamiento es una apuesta a ciegas; no se distingue lo que funciona.<\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">05<\u002Ftd><td class=\"pp\">Cadencia Scrum rígida con cuellos fuera de dev<\u002Ftd><td>Esperar 2 semanas impide experimentar y responder a urgencias comerciales.<\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">06<\u002Ftd><td class=\"pp\">Tres canales paralelos diluyen la priorización<\u002Ftd><td>Durante la ejecución nadie tiene autoridad ni criterio para decir «no».<\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">07<\u002Ftd><td class=\"pp\">No hay medición objetiva de productividad<\u002Ftd><td>Liderazgo evalúa por percepción, presencia y output visible.<\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">08<\u002Ftd><td class=\"pp\">0 tests · 0 CI/CD en 76 repos · deploys nocturnos<\u002Ftd><td>Cada mejora de velocidad upstream se frena en el mismo cuello.<\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">09<\u002Ftd><td class=\"pp\">Adquisición de clientes lenta<\u002Ftd><td>30 % de cumplimiento de adquisición en último Q; causa raíz no diagnosticada.<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════════════════\n     SLIDE 10 · PAIN POINTS MEDIOS\n═════════════════════════════════════════════════════════════════ -->\n<section data-label=\"10 Pain points medios\">\n  <div class=\"chrome\">\n    <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>10 · Pain points · medios<\u002Fdiv>\n    <div class=\"rule-top\"><\u002Fdiv>\n    <div class=\"footer\"><span>TNHI × Koggi · Diagnóstico<\u002Fspan><span class=\"right\">10 / 13<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"body\">\n    <h1 class=\"h1\" style=\"margin-bottom: 28px;\">Seis pain points medios: derivados, pero accionables.<\u002Fh1>\n    <div class=\"painsec\">\n      <table class=\"ptbl\">\n        <thead>\n          <tr>\n            <th style=\"width:64px\">#<\u002Fth>\n            <th style=\"width:520px\">Pain point<\u002Fth>\n            <th>Por qué es un dolor<\u002Fth>\n          <\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr><td class=\"num\">01<\u002Ftd><td class=\"pp\">BAs juniors sin entrenamiento; CPO consume tiempo formándolos<\u002Ftd><td>El tiempo de la única líder de producto se va en coaching operativo, no en estrategia.<\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">02<\u002Ftd><td class=\"pp\">Cuellos ocultos: definición upstream + QA downstream<\u002Ftd><td>~50 % de capacidad ociosa en devs reciclada en deuda técnica. Más devs no mueve throughput.<\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">03<\u002Ftd><td class=\"pp\">Calidad de negocio se valida en producción<\u002Ftd><td>Cada error en scoring erosiona la credibilidad necesaria para cerrar y retener.<\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">04<\u002Ftd><td class=\"pp\">Capacidad de IA 100 % al cliente, 0 % interno<\u002Ftd><td>La misma capacidad que sirve a clientes podría destrabar QA, soporte y síntesis de feedback.<\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">05<\u002Ftd><td class=\"pp\">Sin postmortems ni retros que generen acción<\u002Ftd><td>Los mismos problemas se repiten sprint tras sprint sin mecanismo de aprendizaje.<\u002Ftd><\u002Ftr>\n          <tr><td class=\"num\">06<\u002Ftd><td class=\"pp\">Respuesta default ante restricciones: contratar<\u002Ftd><td>Cada contratación cuesta meses; las alternativas (automatización, IA) no se evalúan antes.<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════════════════\n     SLIDE 11 · MARCO SVPG\n═════════════════════════════════════════════════════════════════ -->\n<section data-label=\"11 Marco SVPG\">\n  <div class=\"chrome\">\n    <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>11 · Marco de transformación<\u002Fdiv>\n    <div class=\"rule-top\"><\u002Fdiv>\n    <div class=\"footer\"><span>TNHI × Koggi · Diagnóstico<\u002Fspan><span class=\"right\">11 / 13<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"body\">\n    <h1 class=\"h1\">Del <em>feature factory<\u002Fem> al Product Operating Model.<\u002Fh1>\n    <div class=\"marco\">\n      <div>\n        <p class=\"p\" style=\"max-width: 700px; margin-bottom: 8px;\">Marty Cagan describe la transformación como un cambio hacia un modelo donde el equipo recibe problemas, hace discovery para encontrar la mejor solución, y rinde por outcomes — no por features entregadas.<\u002Fp>\n        <div class=\"arrow-row\">\n          <div class=\"state curr\">\n            <div class=\"l\">Hoy<\u002Fdiv>\n            <div class=\"t\">Recibe features<br>y se mide por output<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"arr\">→<\u002Fdiv>\n          <div class=\"state next\">\n            <div class=\"l\">90 días<\u002Fdiv>\n            <div class=\"t\">Recibe problemas<br>y rinde outcomes<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"p small\" style=\"color: var(--muted); max-width: 660px;\">Atacar los síntomas sin cambiar el modelo solo vuelve a traer los mismos pain points más adelante.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div class=\"mono\" style=\"margin-bottom: 20px;\">Tres condiciones previas<\u002Fdiv>\n        <div class=\"cond\">\n          <div class=\"cn\">1<\u002Fdiv>\n          <div class=\"ctxt\"><b>Liderazgo de producto competente.<\u002Fb> Alguien que haya hecho discovery, medido outcomes, y ganado confianza con datos.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cond\">\n          <div class=\"cn\">2<\u002Fdiv>\n          <div class=\"ctxt\"><b>Equipo con las capacidades necesarias.<\u002Fb> Primero competencia, después empoderamiento — no al revés.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cond\">\n          <div class=\"cn\">3<\u002Fdiv>\n          <div class=\"ctxt\"><b>Relación redefinida con el negocio.<\u002Fb> De tomador de pedidos a socio con contrato explícito y métricas compartidas.<\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"p small\" style=\"margin-top: 24px; color: var(--accent);\">Koggi hoy no cumple ninguna de las tres. El roadmap las ataca en paralelo.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════════════════\n     SLIDE 12 · ROADMAP\n═════════════════════════════════════════════════════════════════ -->\n<section data-label=\"12 Roadmap 90 días\">\n  <div class=\"chrome\">\n    <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>12 · Roadmap 90 días<\u002Fdiv>\n    <div class=\"rule-top\"><\u002Fdiv>\n    <div class=\"footer\"><span>TNHI × Koggi · Diagnóstico<\u002Fspan><span class=\"right\">12 / 13<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"body\">\n    <h1 class=\"h1\" style=\"margin-bottom: 28px;\">People, Process, Product. Tres pilares en paralelo, <em>People<\u002Fem> arranca primero.<\u002Fh1>\n    <div class=\"roadmap\">\n      <div class=\"pillar-card\">\n        <div class=\"head\">\n          <div class=\"pn\">Pilar 01<\u002Fdiv>\n          <div class=\"pt\">People<\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"pin\">Instalar la capacidad de producto que falta.<\u002Fp>\n        <ol>\n          <li>\n            <div class=\"li-n\">01<\u002Fdiv>\n            <div>\n              <span class=\"li-t\">Consultor de producto embebido<\u002Fspan>\n              <span class=\"li-s\">90 días. Lidera discovery, instala métricas, transfiere a la CPO por proximidad.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n\n      <div class=\"pillar-card\">\n        <div class=\"head\">\n          <div class=\"pn\">Pilar 02<\u002Fdiv>\n          <div class=\"pt\">Process<\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"pin\">Cambiar las reglas del juego.<\u002Fp>\n        <ol>\n          <li>\n            <div class=\"li-n\">02<\u002Fdiv>\n            <div>\n              <span class=\"li-t\">Comité único de priorización<\u002Fspan>\n              <span class=\"li-s\">Feature requests se traducen a problemas antes del backlog.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li>\n            <div class=\"li-n\">03<\u002Fdiv>\n            <div>\n              <span class=\"li-t\">Métricas vivas<\u002Fspan>\n              <span class=\"li-s\">5–8 métricas de outcome en dashboard único para equipo y liderazgo.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li>\n            <div class=\"li-n\">04<\u002Fdiv>\n            <div>\n              <span class=\"li-t\">CI/CD y quality gates<\u002Fspan>\n              <span class=\"li-s\">3 repos críticos con CI en semana 4; deploys independientes en semana 6.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li>\n            <div class=\"li-n\">05<\u002Fdiv>\n            <div>\n              <span class=\"li-t\">De sprints a flujo continuo<\u002Fspan>\n              <span class=\"li-s\">Kanban con cycle time medido y WIP limits ajustados por evidencia.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n\n      <div class=\"pillar-card\">\n        <div class=\"head\">\n          <div class=\"pn\">Pilar 03<\u002Fdiv>\n          <div class=\"pt\">Product<\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"pin\">Entender al cliente, construir lo correcto, aprender de cada entrega.<\u002Fp>\n        <ol>\n          <li>\n            <div class=\"li-n\">06<\u002Fdiv>\n            <div>\n              <span class=\"li-t\">Discovery sistemático<\u002Fspan>\n              <span class=\"li-s\">10+ sesiones con clientes en 7 semanas: actuales, prospectos perdidos, churn.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li>\n            <div class=\"li-n\">07<\u002Fdiv>\n            <div>\n              <span class=\"li-t\">Ciclo de experimentación<\u002Fspan>\n              <span class=\"li-s\">≥1 experimento activo por semana; hipótesis, medición, decisión.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════════════════════════════════════════════════════════\n     SLIDE 13 · CIERRE\n═════════════════════════════════════════════════════════════════ -->\n<section data-label=\"13 Cierre\">\n  <div class=\"chrome\">\n    <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>13 · Cierre<\u002Fdiv>\n    <div class=\"rule-top\"><\u002Fdiv>\n    <div class=\"footer\"><span>TNHI × Koggi · Diagnóstico<\u002Fspan><span class=\"right\">13 / 13<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"body\">\n    <div class=\"cierre\">\n      <div>\n        <div class=\"mono\" style=\"margin-bottom: 24px;\">Qué se logra al cierre<\u002Fdiv>\n        <p class=\"lead\">Al final de los <em>90 días<\u002Fem>, Koggi no tiene la transformación completa.<span class=\"sub\">Tiene el cimiento que hoy no existe: datos, contacto con cliente, y primeras señales de un equipo que opera por evidencia.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <ul>\n        <li><span class=\"ck\">→<\u002Fspan><span>La organización tiene <b>datos para decidir<\u002Fb>, no percepción.<\u002Fspan><\u002Fli>\n        <li><span class=\"ck\">→<\u002Fspan><span>El equipo habló con <b>10 + clientes<\u002Fb> por primera vez de forma sistemática.<\u002Fspan><\u002Fli>\n        <li><span class=\"ck\">→<\u002Fspan><span>Primera señal medible en el <b>ciclo de desconfianza<\u002Fb>: si las iniciativas mueven outcomes, liderazgo empieza a delegar.<\u002Fspan><\u002Fli>\n        <li><span class=\"ck\">→<\u002Fspan><span>Al menos <b>2 experimentos<\u002Fb> corridos con decisión basada en evidencia.<\u002Fspan><\u002Fli>\n        <li><span class=\"ck\">→<\u002Fspan><span>Discovery produjo evidencia de <b>por qué no compran y por qué se van.<\u002Fb><\u002Fspan><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdeck-stage>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
